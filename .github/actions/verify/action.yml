name: Verify plugin
description: Build and verify committed WiFi Optimizer artifacts
runs:
  using: composite
  steps:
    - name: Set up Node.js 24
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"
    - name: Install pnpm 9.15.9
      shell: bash
      run: npm install --global pnpm@9.15.9
    - name: Snapshot committed distribution
      shell: bash
      run: python scripts/check_delivery.py snapshot --output "$RUNNER_TEMP/wifi-optimizer-dist.json"
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Build
      shell: bash
      run: pnpm run build
    - name: Check project types
      shell: bash
      run: pnpm exec tsc --noEmit --skipLibCheck
    - name: Validate Python and shell syntax
      shell: bash
      run: python scripts/check_delivery.py check-syntax
    - name: Test delivery validators
      shell: bash
      run: python -m unittest discover -s tests -v
    - name: Verify rebuilt distribution
      shell: bash
      run: python scripts/check_delivery.py verify-dist --snapshot "$RUNNER_TEMP/wifi-optimizer-dist.json"
